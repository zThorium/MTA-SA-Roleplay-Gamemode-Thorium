<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Propiedad</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #f2f4f8; background: rgba(0, 0, 0, 0.35); user-select: none; }
        body { display: flex; align-items: center; justify-content: center; }
        .modal { width: 400px; padding: 26px; border-radius: 18px; background: rgba(12, 14, 20, 0.96); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); animation: enter 0.25s ease-out; }
        @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(76, 211, 138, 0.15); color: #4cd38a; font-size: 12px; font-weight: 700; }
        h1 { margin: 12px 0 4px; font-size: 22px; }
        .type { color: #9aa3b2; font-size: 14px; }
        .price { margin: 18px 0; padding: 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); }
        .price small { display: block; color: #9aa3b2; font-size: 12px; }
        .price strong { font-size: 28px; color: #4cd38a; }
        .note { margin-bottom: 18px; font-size: 12px; color: #6f7888; line-height: 1.5; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
        .buy { background: #4cd38a; color: #06210f; }
        .preview { background: rgba(255, 255, 255, 0.1); color: #f2f4f8; }
        .close { grid-column: span 2; background: transparent; color: #9aa3b2; font-weight: 400; }
        button:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <main class="modal">
        <span class="badge">EN VENTA</span>
        <h1 id="name">Propiedad</h1>
        <p class="type" id="type">Casa</p>
        <div class="price"><small>Precio</small><strong id="price">$0</strong></div>
        <p class="note">La compra se paga desde tu cuenta bancaria. Puedes visitar el interior durante 1 minuto antes de decidir.</p>
        <div class="actions">
            <button type="button" class="buy" id="buy">Comprar</button>
            <button type="button" class="preview" id="preview">Previsualizar</button>
            <button type="button" class="close" id="close">Ahora no (Esc)</button>
        </div>
    </main>
    <script>
        (function () {
            function send(e) { if (window.mta) mta.triggerEvent(e); else console.log(e); }
            document.getElementById("buy").addEventListener("click", function () { send("rp:prop:ui:buy"); });
            document.getElementById("preview").addEventListener("click", function () { send("rp:prop:ui:preview"); });
            document.getElementById("close").addEventListener("click", function () { send("rp:prop:ui:close"); });
            document.addEventListener("keydown", function (e) { if (e.key === "Escape") send("rp:prop:ui:close"); });
            window.RP = {
                show: function (info) {
                    document.getElementById("name").textContent = info.name;
                    document.getElementById("type").textContent = info.typeName;
                    document.getElementById("price").textContent = "$" + Number(info.price).toLocaleString("es");
                }
            };
        })();
    </script>
</body>
</html>
