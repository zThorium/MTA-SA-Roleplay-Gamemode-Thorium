<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Roleplay - Personajes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Panel izquierdo -->
    <aside class="panel">
        <!-- Seleccion -->
        <section id="view-select" class="view active">
            <header>
                <h1>Tus personajes</h1>
                <p id="slots-info">Elige un personaje o crea uno nuevo</p>
            </header>
            <div id="slots" class="slots"></div>
            <p class="message" id="select-message" aria-live="polite"></p>
        </section>

        <!-- Creacion -->
        <section id="view-create" class="view">
            <header>
                <h1>Nuevo personaje</h1>
                <p>Define quien es tu personaje. Todo se puede rolear, pero esto es su punto de partida.</p>
            </header>

            <form id="form-create" autocomplete="off" novalidate>
                <div class="row">
                    <label>Nombre<input name="firstName" type="text" maxlength="15" placeholder="Juan" spellcheck="false"></label>
                    <label>Apellido<input name="lastName" type="text" maxlength="15" placeholder="Perez" spellcheck="false"></label>
                </div>

                <div class="field">
                    <span class="label">Genero</span>
                    <div class="toggle" id="gender">
                        <button type="button" data-gender="0" class="active">Masculino</button>
                        <button type="button" data-gender="1">Femenino</button>
                    </div>
                </div>

                <div class="appearance">
                    <div class="appearance-head">
                        <span class="label">Apariencia</span>
                        <button type="button" class="link" id="btn-zoom">Ver rostro</button>
                    </div>
                    <div class="field" id="race-field">
                        <span class="label">Raza</span>
                        <div class="toggle four" id="race"></div>
                    </div>
                    <div id="selectors" class="selectors"></div>
                </div>

                <div class="row three">
                    <label>Edad<input name="age" type="number" min="16" max="90" value="25"></label>
                    <label>Peso (kg)<input name="weight" type="number" min="40" max="200" value="75"></label>
                    <label>Altura (cm)<input name="height" type="number" min="140" max="220" value="175"></label>
                </div>

                <label>Lugar de origen<input name="origin" type="text" maxlength="48" placeholder="Los Santos, San Andreas"></label>

                <label>Historia del personaje
                    <textarea name="story" maxlength="2000" rows="7" placeholder="De donde viene, a que se dedica, que busca en Los Santos..."></textarea>
                    <small id="story-count">0 / 2000 (minimo 100)</small>
                </label>

                <p class="message" id="create-message" aria-live="polite"></p>

                <div class="actions">
                    <button type="button" class="secondary" id="btn-back">Volver</button>
                    <button type="submit" class="primary" id="btn-create">Crear personaje</button>
                </div>
            </form>
        </section>
    </aside>

    <!-- Zona de la vista previa: arrastrar para girar al personaje -->
    <div id="stage" class="stage">
        <p class="stage-hint">Arrastra para girar al personaje</p>
    </div>

    <!-- Confirmacion de borrado -->
    <div class="modal" id="modal-delete" hidden>
        <div class="modal-box">
            <h2>Eliminar personaje</h2>
            <p>Esta accion no se puede deshacer. Escribe <strong id="delete-name"></strong> para confirmar.</p>
            <input id="delete-input" type="text" spellcheck="false">
            <div class="actions">
                <button type="button" class="secondary" id="delete-cancel">Cancelar</button>
                <button type="button" class="danger" id="delete-confirm" disabled>Eliminar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
