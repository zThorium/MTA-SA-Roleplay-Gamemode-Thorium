<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Bomberos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Iconos SVG reutilizables -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="g-flame" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#ff3d1f"/><stop offset=".55" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffd24a"/>
            </linearGradient>
        </defs>
        <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 3.2-.6 5-2 6.6C8.6 10.2 7 12 7 14.6A5 5 0 0 0 12 20a5 5 0 0 0 5-5.2c0-2-1-3.4-2-4.6.1 1.4-.3 2.6-1.4 3.2.4-3.6-.6-7.6-1.6-11.4z"/></symbol>
        <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3.2"/><path d="M6.5 21v-6.5A5.5 5.5 0 0 1 12 9a5.5 5.5 0 0 1 5.5 5.5V21z"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.4 3.2 3.2-1.4 1.4-3.8-3.8V6h2z"/></symbol>
        <symbol id="i-helmet" viewBox="0 0 24 24"><path d="M3 16a9 9 0 0 1 18 0v1H3zm-1 2h20v2H2zM11 5h2v6h-2z"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m9.5 16.2-4.2-4.2-1.4 1.4 5.6 5.6 11-11-1.4-1.4z"/></symbol>
        <symbol id="i-cross" viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></symbol>
    </svg>

    <!-- ================= HUD ================= -->
    <div id="hud" class="hidden">
        <div id="urgency" class="urgency"></div>

        <!-- Alerta entrante -->
        <div id="alert" class="alert hidden">
            <div class="alert-stripes"></div>
            <div class="alert-body">
                <div class="alert-head">
                    <div class="beacon"><svg><use href="#i-flame"/></svg></div>
                    <div>
                        <div class="alert-kicker">CENTRAL SFFD · CÓDIGO 3</div>
                        <div class="alert-title">Incendio estructural</div>
                    </div>
                </div>
                <div class="alert-place" id="alert-name"></div>
                <div class="alert-zone"><svg><use href="#i-pin"/></svg><span id="alert-zone"></span></div>
                <div class="chips">
                    <span class="chip mono" id="alert-coords"></span>
                    <span class="chip fire"><svg><use href="#i-flame"/></svg><b id="alert-foci"></b> focos</span>
                    <span class="chip life"><svg><use href="#i-person"/></svg><b id="alert-victims"></b> atrapados</span>
                    <span class="chip"><svg><use href="#i-clock"/></svg><b id="alert-time"></b></span>
                </div>
                <div class="alert-foot">Sigue el <b>blip naranja</b> del radar. Los civiles tienen aire para <b id="alert-life"></b>.</div>
            </div>
        </div>

        <!-- Panel del incidente -->
        <div id="inc" class="inc hidden">
            <div class="inc-head">
                <svg class="inc-flame"><use href="#i-flame"/></svg>
                <div class="inc-titles">
                    <div class="inc-kicker">EMERGENCIA ACTIVA</div>
                    <div class="inc-name" id="inc-name"></div>
                    <div class="inc-zone" id="inc-zone"></div>
                </div>
            </div>
            <div class="inc-timer">
                <div class="inc-time" id="inc-time">0:00</div>
                <div class="bar"><i id="inc-bar"></i></div>
                <div class="inc-time-label">Estructura</div>
            </div>
            <div class="sec-label">Focos <span id="inc-foci-count"></span></div>
            <div class="foci" id="inc-foci"></div>
            <div class="sec-label">Civiles <span id="inc-vic-count"></span></div>
            <div class="victims" id="inc-victims"></div>
            <div class="guide" id="guide">
                <div class="guide-keys" id="guide-keys"></div>
                <div class="guide-text" id="guide-text"></div>
            </div>
        </div>

        <!-- Resultado -->
        <div id="result" class="result hidden">
            <div class="result-glow"></div>
            <div class="result-icon"><svg id="result-svg"><use href="#i-check"/></svg></div>
            <div class="result-kicker" id="result-kicker"></div>
            <div class="result-title" id="result-title"></div>
            <div class="result-reason" id="result-reason"></div>
            <div class="result-grid" id="result-grid"></div>
            <div class="result-rank" id="result-rank"></div>
        </div>
    </div>

    <!-- ================= PANEL DEL VESTUARIO ================= -->
    <div id="panel" class="panel-wrap hidden">
        <div class="window">
            <div class="win-head">
                <svg class="win-ico"><use href="#i-helmet"/></svg>
                <div>
                    <div class="win-kicker">ESTACIÓN DE BOMBEROS</div>
                    <div class="win-title">Vestuario</div>
                </div>
                <div class="win-keys"><kbd>Esc</kbd> cerrar</div>
                <button class="win-close" id="btn-close">×</button>
            </div>
            <div class="win-body">
                <div class="col-left">
                    <div class="step-label"><span class="step-n">1</span> Elige tu uniforme</div>
                    <div class="skins" id="skins"></div>
                    <div class="step-label"><span class="step-n">2</span> Equipo reglamentario</div>
                    <div class="equip" id="equip"></div>
                    <button class="duty-btn" id="duty-btn"><img class="key-ico" src="../images/keys/mouse_left.png"><span id="duty-label"></span></button>
                    <div class="duty-hint" id="duty-hint"></div>
                </div>
                <div class="col-right">
                    <div class="profile">
                        <div class="badge" id="badge"><svg><use href="#i-flame"/></svg><span id="badge-n"></span></div>
                        <div>
                            <div class="p-name" id="p-name"></div>
                            <div class="p-rank" id="p-rank"></div>
                        </div>
                    </div>
                    <div class="xp">
                        <div class="xp-row"><span>Experiencia de facción</span><b id="xp-text"></b></div>
                        <div class="bar xp-bar"><i id="xp-bar"></i></div>
                        <div class="xp-next" id="xp-next"></div>
                    </div>
                    <div class="stats" id="stats"></div>
                    <div class="status" id="status"></div>
                </div>
            </div>
            <div class="coach-bubble hidden" id="coach"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
