<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Concesionario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #f2f4f8; background: linear-gradient(90deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%); user-select: none; }
        .panel { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 380px; padding: 26px; border-radius: 18px; background: rgba(12, 14, 20, 0.95); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 24px 60px rgba(0,0,0,0.55); animation: enter 0.3s ease-out; }
        @keyframes enter { from { opacity: 0; transform: translate(30px, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
        .dealer { font-size: 12px; color: #4696ff; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        h1 { margin: 6px 0 2px; font-size: 28px; }
        .cat { color: #9aa3b2; font-size: 14px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0; }
        .stat { padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.05); }
        .stat small { display: block; font-size: 11px; color: #9aa3b2; }
        .stat b { font-size: 17px; }
        .label { font-size: 13px; color: #9aa3b2; margin-bottom: 8px; }
        .colors { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
        .swatch.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(70,150,255,0.6); }
        .price { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .price strong { font-size: 26px; color: #4cd38a; }
        .note { font-size: 12px; color: #6f7888; margin-bottom: 14px; }
        .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        button.buy, button.close { padding: 12px; border: 0; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
        .buy { background: #4696ff; color: #fff; }
        .close { background: rgba(255,255,255,0.1); color: #f2f4f8; }
        button:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <main class="panel">
        <div class="dealer">Coutt and Schutz</div>
        <h1 id="name">Vehiculo</h1>
        <p class="cat" id="category"></p>
        <div class="stats">
            <div class="stat"><small>Velocidad maxima</small><b id="speed">0 km/h</b></div>
            <div class="stat"><small>Plazas</small><b id="seats">0</b></div>
        </div>
        <p class="label">Color</p>
        <div class="colors" id="colors"></div>
        <div class="price"><span>Precio</span><strong id="price">$0</strong></div>
        <p class="note" id="note">Se paga desde tu cuenta bancaria.</p>
        <div class="actions">
            <button type="button" class="buy" id="buy">Comprar</button>
            <button type="button" class="close" id="close">Cerrar</button>
        </div>
    </main>
    <script>
        (function () {
            var data = null, color = 1;
            function send() { var a = Array.prototype.slice.call(arguments); if (window.mta) mta.triggerEvent.apply(mta, a); else console.log(a); }
            document.getElementById("buy").addEventListener("click", function () { if (data) send("rp:dealer:ui:buy", data.spot, color); });
            document.getElementById("close").addEventListener("click", function () { send("rp:dealer:ui:close"); });
            document.addEventListener("keydown", function (e) { if (e.key === "Escape") send("rp:dealer:ui:close"); });
            window.RP = {
                show: function (d) {
                    data = d;
                    document.getElementById("name").textContent = d.name;
                    document.getElementById("category").textContent = d.category;
                    document.getElementById("speed").textContent = d.maxSpeed + " km/h";
                    document.getElementById("seats").textContent = d.seats;
                    document.getElementById("price").textContent = "$" + Number(d.price).toLocaleString("es");
                    document.getElementById("note").textContent = "Se paga desde tu cuenta bancaria. Los autos de este lote cambian en " + d.nextRotation + " min.";
                    var box = document.getElementById("colors");
                    box.innerHTML = "";
                    (d.colors || []).forEach(function (c, i) {
                        var s = document.createElement("div");
                        s.className = "swatch" + (i + 1 === color ? " active" : "");
                        s.title = c[0];
                        s.style.background = "rgb(" + c[1] + "," + c[2] + "," + c[3] + ")";
                        s.addEventListener("click", function () {
                            color = i + 1;
                            box.querySelectorAll(".swatch").forEach(function (x) { x.classList.remove("active"); });
                            s.classList.add("active");
                        });
                        box.appendChild(s);
                    });
                }
            };
        })();
    </script>
</body>
</html>
