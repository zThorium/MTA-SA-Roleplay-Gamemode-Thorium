<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Mochila</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="window">
        <header>
            <div id="bp-icon"></div>
            <div>
                <h1 id="title">Mochila</h1>
                <p class="hint">Clic: mover 1 · Mayus + clic: mover todo · <kbd>O</kbd> / <kbd>Esc</kbd> cerrar</p>
            </div>
            <div class="weight">
                <span id="weight-label">0 / 0 kg</span>
                <div class="bar"><div id="weight-bar"></div></div>
            </div>
            <button type="button" id="btn-close" aria-label="Cerrar">&times;</button>
        </header>
        <div class="cols">
            <section><h2>En la mochila</h2><div class="list" id="bp-list"></div></section>
            <section><h2>Inventario</h2><div class="list" id="inv-list"></div></section>
        </div>
        <footer><button type="button" id="btn-drop">Tirar mochila (y todo su contenido)</button></footer>
    </main>
    <script src="app.js"></script>
</body>
</html>
