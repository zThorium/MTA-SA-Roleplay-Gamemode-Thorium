<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Editor de accesorio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="editor-body">
    <aside class="editor">
        <header>
            <div>
                <h1 id="toy-name">Accesorio</h1>
                <p class="hint">Ajusta y pulsa Guardar. <kbd>Esc</kbd> cancela.</p>
            </div>
        </header>
        <div class="editor-scroll">
            <label class="field">Hueso
                <select id="bone"></select>
            </label>
            <h3>Posicion (m)</h3>
            <div id="pos"></div>
            <h3>Rotacion (grados)</h3>
            <div id="rot"></div>
            <h3>Tamano</h3>
            <label class="check"><input type="checkbox" id="uniform" checked> Escala uniforme</label>
            <div id="scale"></div>
            <h3>Camara</h3>
            <div id="cam"></div>
        </div>
        <footer>
            <button type="button" class="ghost" id="btn-reset">Restablecer</button>
            <button type="button" class="ghost" id="btn-cancel">Cancelar</button>
            <button type="button" class="primary" id="btn-save">Guardar</button>
        </footer>
    </aside>
    <script src="editor.js"></script>
</body>
</html>
