<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="window" id="window">
        <header>
            <div class="title">
                <h1>Inventario</h1>
                <p class="hint"><kbd>I</kbd> / <kbd>Esc</kbd> cerrar · arrastra un objeto <b>fuera</b> de la ventana para dejarlo en el suelo</p>
            </div>
            <div class="weight">
                <div class="weight-top"><span>Peso</span><span id="weight-label">0 / 15 kg</span></div>
                <div class="bar"><div id="weight-bar"></div></div>
            </div>
            <button type="button" class="close" id="btn-close" aria-label="Cerrar">&times;</button>
        </header>

        <div class="content">
            <section class="grid" id="grid"></section>
            <aside class="details" id="details"></aside>
        </div>
    </main>

    <!-- Fuera de la ventana: sigue visible mientras arrastras (la ventana se vuelve translucida) -->
    <aside class="nearby" id="nearby">
        <h3>Cerca de ti</h3>
        <div id="nearby-list"></div>
        <p class="nearby-hint">Arrastra un objeto sobre una persona o pulsa <b>Dar</b>.</p>
    </aside>

    <div class="ghost" id="ghost"></div>
    <script src="app.js"></script>
</body>
</html>
