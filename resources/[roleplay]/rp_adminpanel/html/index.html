<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Panel de administracion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="side">
            <div class="brand"><span class="logo">T</span><div><b>Thorium</b><small>Centro de administracion</small></div></div>
            <nav id="tabs"></nav>
            <div class="side-foot"><kbd>Esc</kbd> cerrar panel</div>
        </aside>
        <section class="main">
            <header class="top">
                <div><h1 id="page-title">Panel</h1><p id="page-sub"></p></div>
                <input id="search" type="text" placeholder="Buscar..." autocomplete="off" maxlength="40">
                <div class="me"><span class="avatar" id="avatar"></span><div><b id="who"></b><small id="role"></small></div></div>
                <button id="btn-close" class="close" title="Cerrar">&times;</button>
            </header>
            <main id="view"></main>
            <footer><span id="count"></span><span id="status"></span></footer>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
